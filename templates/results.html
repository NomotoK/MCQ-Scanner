<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>MCQ Scanner</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/results_style.css') }}" type="text/css">
    <script src="static/js/script.js"></script>
</head>


<body>
    <main class="main-home">

        <div class="grid">

            <div class="container-left">

                <div id="heading">
                    <h1>View Results</h1>
                </div>

                <div id="container-fig1">
                    
                    <img src="/static/images/output/bar_chart.png" alt="Bar Chart of Total Marks">
                </div>
                
                <div id="container-fig2">
                    
                    <img src="/static/images/output/pie_chart.png" alt="Pie Chart of Incorrect Answers">
                </div>
                
            </div>
  
            <div class="container-right">

                <div id = "container-student-score-title">
                    <h1>Student Scores</h1>
                </div>
                

                <div id="container-student-scores">
                    <table>
                        {% for row in csv_data %}
                            <tr>
                                {% for cell in row %}
                                    <td>{{ cell }}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </table>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
